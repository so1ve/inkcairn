name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    uses: so1ve/workflows/.github/workflows/rust-ci.yml@v1
    with:
      toolchain: nightly
      runs-on: ubuntu-24.04
      runs-on-matrix: '"ubuntu-24.04"'

  nix:
    name: Nix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - run: nix fmt -- --ci
      - run: nix flake check --all-systems

  build:
    permissions:
      contents: read
      packages: write
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - uses: so1ve/nur-packages/.github/actions/setup-cache@main
        if: github.event_name != 'pull_request'
        with:
          signing-key: ${{ secrets.ORANC_SIGNING_KEY }}
      - run: nix build ".#packages.${{ matrix.system }}.default" --print-build-logs
